services:
  - type: web
    name: axyntrel
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_PERSISTENT_ROOM_STORAGE
        value: "false"
      - key: ALLOW_SERVER_CALL_LOGS
        value: "false"
      - key: APP_ORIGIN
        value: https://axyntrel-1-main.onrender.com
